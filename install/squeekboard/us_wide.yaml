# Language: English (US)
# The same layout as the lock screen (install/gtklock-keyboard.c) and the login screen (SDDM/sugar-dark/Components/TouchKeys.qml):
# install/tests/test_keyboards.py checks they agree. Split in two for the thumbs, on a wide screen.
# Squeekboard's own, with an Arch logo Super key and Ctrl in place of its layout button, and Esc and Tab with the numbers.
# install/surface.sh copies this to ~/.local/share/squeekboard/keyboards.
---
outlines:
    default:       { width: 53.76,  height: 42 }
    change-view:   { width: 80.64,  height: 42 }
    change-view-2: { width: 94.08,  height: 42 }
    large:         { width: 53.76,  height: 42 }
    spaceline:     { width: 94.08, height: 42 }
    spaceline2:    { width: 148.0, height: 42 }
    special:       { width: 53.76,  height: 42 }
    special-2:     { width: 80.64,  height: 42 }
    special-3:     { width: 94.08,  height: 42 }
    gap:           { width: 600,    height: 42 }
    gap-s:         { width: 192.48, height: 42 }

views:
    base:
        - "q w e r t gap y u i o p"
        - "a s d f g gap h j k l '"
        - "show_upper z x c v gap b n m , BackSpace"
        - "show_numbers super ctrl space gap-s left up down right gap-s space2 . Return"
    upper:
        - "Q W E R T gap Y U I O P"
        - "A S D F G gap H J K L '"
        - "show_upper Z X C V gap B N M , BackSpace"
        - "show_numbers super ctrl space gap-s left up down right gap-s space2 . Return"
    numbers:
        - "1 2 3 4 5 gap 6 7 8 9 0"
        - "@ # $ % & gap - _ + ( )"
        - "show_symbols , \" ' : gap ; ! ? / BackSpace"
        - "show_letters esc tab space gap-s left up down right gap-s space2 . Return"
    symbols:
        - "~ ` | · √ gap π τ ÷ × ¶"
        - "© ® £ € ¥ gap ^ ° * { }"
        - "show_numbers_from_symbols \\ / < > gap = [ ] ¬ BackSpace"
        - "show_letters esc tab space gap-s left up down right gap-s space2 . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    super:
        modifier: "Mod4"
        outline: "special"
        label: "\uf303"
    ctrl:
        modifier: "Control"
        outline: "special"
        label: "Ctrl"
    esc:
        keysym: "Escape"
        outline: "special"
        label: "Esc"
    tab:
        keysym: "Tab"
        outline: "special"
        label: "Tab"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_numbers_from_symbols:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    .:
        outline: "large"
    space:
        outline: "spaceline"
        text: " "
    space2:
        outline: "spaceline2"
        text: " "
    gap:
        outline: "gap"
        text: ""
    gap-s:
        outline: "gap-s"
        text: ""
    left:
        keysym: "Left"
        outline: "special"
        label: "←"
    up:
        keysym: "Up"
        outline: "special"
        label: "↑"
    down:
        keysym: "Down"
        outline: "special"
        label: "↓"
    right:
        keysym: "Right"
        outline: "special"
        label: "→"
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
