name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # weekly: catches packages that were renamed or removed from the AUR

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Updates keep your settings, and the install choices work
        run: python3 -m unittest discover -s install/tests -v
      - name: Syntax check, then shellcheck (warnings and errors)
        run: |
          # Every tracked script that starts with a shell shebang
          files=$(git ls-files | grep -E '\.sh$|^bash/' | while read -r f; do
            head -1 "$f" | grep -qE '^#!.*(bash|sh)' && echo "$f"
          done)
          fail=0
          for f in $files; do bash -n "$f" || fail=1; done
          # category-mode.sh uses coproc, which shellcheck cannot parse (bash -n above still checks it)
          shellcheck -S warning $(echo "$files" | grep -v category-mode.sh) || fail=1
          exit $fail

  tests:
    name: Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ollama prompt_toolkit
      - name: Unit tests
        working-directory: .config/hypr/assistant
        run: python -m unittest discover -s tests -v

  settings:
    name: Settings app tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install prompt_toolkit
      - run: sudo apt-get update && sudo apt-get install -y lua5.4   # tests run the real Lua config files against a stub
      - name: Unit tests
        working-directory: .config/hypr/settings
        run: python -m unittest discover -s tests -v

  tray:
    name: Quick tray tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1
      - name: Unit tests
        working-directory: .config/hypr/tray
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Notes tests
        working-directory: .config/hypr/notes
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Sound app tests
        working-directory: .config/hypr/audio
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Launcher tests
        working-directory: .config/hypr/launcher
        run: /usr/bin/python3 -m unittest discover -s tests -v

  notes-rust:
    name: Notes (Rust) builds and passes its tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest   # the same GTK 4 and gtk4-layer-shell as the desktop
    steps:
      - run: pacman -Syu --noconfirm --needed git rust gcc pkgconf gtk4 gtk4-layer-shell python
      - uses: actions/checkout@v4
      - name: Tests, including the check that it formats text exactly as notes.py does
        working-directory: .config/hypr/notes/rs
        run: cargo test --release --locked
      - name: The build script builds and installs it, and the second run sees nothing changed
        run: |
          .config/hypr/notes/build.sh
          ~/.local/lib/hyprdots/hyprdots-notes --version
          .config/hypr/notes/build.sh | grep -q "up to date"
          echo "a thought" | xargs ~/.local/lib/hyprdots/hyprdots-notes --append | xargs cat | grep -q "a thought"

  emoji-rust:
    name: Emoji picker (Rust) builds and passes its tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest   # the same GTK 4 and gtk4-layer-shell as the desktop
    steps:
      - run: pacman -Syu --noconfirm --needed git rust gcc pkgconf gtk4 gtk4-layer-shell
      - uses: actions/checkout@v4
      - name: Tests, formatting and lints
        working-directory: .config/hypr/emoji/rs
        run: |
          cargo test --release --locked
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: The build script builds and installs it, and the second run sees nothing changed
        run: |
          .config/hypr/emoji/build.sh
          ~/.local/lib/hyprdots/hyprdots-emoji --version
          .config/hypr/emoji/build.sh | grep -q "up to date"

  installer:
    name: Installer dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest   # a clean machine: no paru, multilib off, nothing installed
    steps:
      - run: pacman -Syu --noconfirm --needed git   # before checkout, so it is a real clone (the installer uses git ls-files)
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ./hyprinstall.sh --dry-run
        run: HYPR_ASSISTANT=none ./hyprinstall.sh --dry-run </dev/null
      - run: pacman -S --noconfirm --needed python
      - name: The full-screen installer, driven through a real terminal
        run: python install/tests/test_tui.py

  packages:
    name: Install lists still exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Enable multilib (the installer does too; Steam and the lib32 drivers live there)
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git curl python
      - uses: actions/checkout@v4
      - run: ./install/check-packages.sh
