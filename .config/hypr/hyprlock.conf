# Lock screen (hyprlock). Super+L, the power menu's Lock and the Power & lock settings page all end up here.
# Built on the example that ships with hyprlock (/usr/share/hypr/hyprlock.conf), so every option is one this version knows.
# Clear what you typed: Esc, Ctrl+U or Ctrl+Backspace.

$font = CaskaydiaCove Nerd Font
$accent = rgba(949ab3ee)
$text = rgba(faf7faff)

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 110
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 22
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(1c1a1c99)
    outer_color = $accent
    check_color = rgba(7fd17fee)
    fail_color = rgba(ff6b6bee)
    font_color = $text
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

# Who is locked in
label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}
