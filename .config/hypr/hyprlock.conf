# Lock screen (hyprlock): the default look. hypr-settings (Power & lock page) writes your own
# choices to hyprlock.local.conf, which scripts/lock-screen.sh uses instead when it exists.
# Clear what you typed: Esc, Ctrl+U or Ctrl+Backspace.
# grace=0

$font = Adwaita Sans
$text = rgba(ffffffee)
$soft = rgba(ffffffbb)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/rofi/.current_wallpaper
    blur_passes = 0
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(00000059)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_weight="200">$TIME</span>
    color = $text
    font_size = 140
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000088)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $soft
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000088)
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_color = $text
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text =
    fail_text = <span foreground="##ff8a8a">$PAMFAIL</span>
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    position = 0, 96
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 320, 2
    color = $soft
    rounding = 0
    border_size = 0
    position = 0, 90
    halign = center
    valign = bottom
}
