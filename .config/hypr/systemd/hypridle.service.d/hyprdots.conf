# The shipped unit, using the file the settings Power & lock page writes, when there is one.
[Unit]
# Requisite in the shipped unit would stop it starting if the session target is late
Requisite=
OnFailure=hyprdots-part-failed@%n.service
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=1
TimeoutStopSec=5
# Apps opened from it live in its cgroup, and must survive it restarting
KillMode=process
ExecStart=
ExecStart=%h/.config/hypr/scripts/idle-start.sh
