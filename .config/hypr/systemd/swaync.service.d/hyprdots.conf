# The shipped unit, running our launch script (your theme). D-Bus starts this unit too, when something notifies.
[Unit]
OnFailure=hyprdots-part-failed@%n.service
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=1
TimeoutStopSec=5
# Apps opened from it live in its cgroup, and must survive it restarting
KillMode=process
ExecStart=
ExecStart=%h/.config/swaync/launch.sh
