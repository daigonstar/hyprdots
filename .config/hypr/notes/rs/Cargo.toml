[package]
name = "hyprdots-notes"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.20.1"
glib-unix = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
regex = "1.13.1"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
# Small and quick to load: one unit, no unwinding tables, symbols stripped
codegen-units = 1
lto = true
panic = "abort"
strip = true
