# hyprdots: the login screen runs on Wayland inside Weston (kiosk mode) instead of an X server.
# Installed as /etc/sddm.conf.d/zz-hyprdots-wayland.conf; the name makes it load after sddm.conf, so it wins.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=weston --shell=kiosk --config=/etc/sddm/weston.ini
