# hyprdots: leave Plymouth's last frame on screen when it quits, so there is no black gap before the login screen.
# Installed as /etc/systemd/system/plymouth-quit.service.d/10-retain-splash.conf. Only the command changes, not the
# start order, so it cannot make SDDM and Plymouth wait for each other.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
