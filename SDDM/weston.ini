# hyprdots: Weston settings for the SDDM login screen only (your Hyprland session never reads this).
# hyprinstall.sh fills in the keyboard layout and adds an [output] section that switches off every screen
# except your main one, then installs this as /etc/sddm/weston.ini.
[core]
idle-time=0

[keyboard]
keymap_layout=__KB_LAYOUT__

[shell]
cursor-theme=Future-cursors
cursor-size=24
